<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Modern Lagos financial atrium at golden hour">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#19080C" />
      <stop offset="45%" stop-color="#3B0B15" />
      <stop offset="100%" stop-color="#0E1117" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.72" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#C8102E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#111318" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="crimsonRibbon" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#88081D" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272B36" />
      <stop offset="100%" stop-color="#10131A" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2430" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>
    <radialGradient id="rimLight" cx="0.65" cy="0.4" r="0.4">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base atmospheric canvas -->
  <rect width="1600" height="900" fill="url(#bgSky)" />
  <rect width="1600" height="900" fill="url(#sunGlow)" />

  <!-- Distant Lagos Victoria Island skyline silhouettes -->
  <g opacity="0.55">
    <rect x="760" y="210" width="110" height="690" fill="url(#towerGrad)" />
    <rect x="890" y="130" width="145" height="770" fill="url(#towerGrad)" />
    <rect x="1055" y="180" width="120" height="720" fill="url(#towerGrad)" />
    <rect x="1195" y="95" width="165" height="805" fill="url(#towerGrad)" />
    <rect x="1380" y="160" width="150" height="740" fill="url(#towerGrad)" />
    <!-- Subtle sunlit building windows -->
    <g fill="#FDE68A" opacity="0.22">
      <rect x="915" y="165" width="95" height="4" />
      <rect x="915" y="190" width="95" height="4" />
      <rect x="915" y="215" width="95" height="4" />
      <rect x="915" y="240" width="95" height="4" />
      <rect x="1220" y="130" width="115" height="5" />
      <rect x="1220" y="160" width="115" height="5" />
      <rect x="1220" y="190" width="115" height="5" />
      <rect x="1220" y="220" width="115" height="5" />
      <rect x="1405" y="195" width="95" height="4" />
      <rect x="1405" y="225" width="95" height="4" />
    </g>
  </g>

  <!-- Architectural glass curtain-wall mullions -->
  <g stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2">
    <line x1="720" y1="0" x2="640" y2="900" />
    <line x1="940" y1="0" x2="880" y2="900" />
    <line x1="1160" y1="0" x2="1120" y2="900" />
    <line x1="1380" y1="0" x2="1360" y2="900" />
    <line x1="650" y1="260" x2="1600" y2="220" />
    <line x1="620" y1="540" x2="1600" y2="510" />
  </g>

  <!-- Diagonal sunlight beam through atrium -->
  <polygon points="820,0 1350,0 1050,900 540,900" fill="url(#glassPane)" />

  <!-- Architectural crimson accent column -->
  <polygon points="1380,0 1600,0 1600,900 1320,900" fill="url(#crimsonRibbon)" opacity="0.88" />
  <polygon points="1320,900 1380,0 1405,0 1345,900" fill="#FFFFFF" opacity="0.16" />

  <!-- Editorial foreground executive silhouette with tablet & warm rim light -->
  <g transform="translate(880, 210)">
    <ellipse cx="260" cy="240" rx="280" ry="260" fill="url(#rimLight)" />
    <!-- Head & Hair -->
    <circle cx="240" cy="145" r="64" fill="#2A1B17" />
    <path d="M180,130 C180,75 298,72 302,135 C292,102 225,95 180,130 Z" fill="#160F0D" />
    <!-- Subtle warm cheek highlight -->
    <path d="M255,105 C288,118 295,165 268,195 C280,165 276,126 255,105 Z" fill="#D97706" opacity="0.35" />
    <!-- Tailored blazer shoulders & torso -->
    <path d="M85,690 L115,310 C120,255 170,228 240,228 C312,228 362,255 375,310 L415,690 Z" fill="url(#suitGrad)" />
    <!-- Crisp white shirt collar & crimson tie accent -->
    <polygon points="212,228 240,315 268,228" fill="#F8FAFC" />
    <polygon points="232,250 248,250 254,395 240,420 226,395" fill="#C8102E" />
    <!-- Sleek digital tablet held in foreground -->
    <g transform="translate(65, 385) rotate(-8)">
      <rect x="0" y="0" width="235" height="162" rx="14" fill="#090B0F" stroke="#3F4554" stroke-width="2" />
      <rect x="10" y="10" width="215" height="142" rx="8" fill="#151923" />
      <rect x="24" y="26" width="88" height="10" rx="4" fill="#C8102E" />
      <rect x="24" y="50" width="145" height="18" rx="4" fill="#E2E8F0" opacity="0.85" />
      <rect x="24" y="84" width="60" height="44" rx="6" fill="#1E293B" />
      <rect x="94" y="84" width="60" height="44" rx="6" fill="#1E293B" />
      <rect x="164" y="84" width="46" height="44" rx="6" fill="#047857" opacity="0.8" />
    </g>
  </g>

  <!-- Soft bokeh lights in foreground -->
  <circle cx="1470" cy="210" r="65" fill="#FCA5A5" opacity="0.12" />
  <circle cx="1510" cy="640" r="95" fill="#FDE68A" opacity="0.08" />
  <circle cx="720" cy="760" r="80" fill="#C8102E" opacity="0.16" />

  <!-- Left editorial scrim for crisp headline legibility -->
  <rect width="900" height="900" fill="url(#bgSky)" opacity="0.55" />
</svg>
